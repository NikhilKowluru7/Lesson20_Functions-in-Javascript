<!DOCTYPE html>
<html lang="en">
<head>
    <title>Multiplication</title>
</head>
<body>
    <button onclick="myfunction(5)">Press this button</button>
    <script>
        function myfunction(x,y){
            if (y=== undefined){
                y=3;
            }
            document.write(x*y);
        }
    </script>
</body>
</html>
